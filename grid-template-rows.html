<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grid Rows Example</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .container {
        display: grid;
        grid-template-rows: 300px 200px;
        grid-template-columns: 150px 150px; 
        gap: 10px;
      }

      .item {
        background-color: #2196f3;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h2>CSS Grid - Row Height Example</h2>

    <div class="container">
      <div class="item">Row 1</div>
      <div class="item">Row 1</div>
      <div class="item">Row 2</div>
      <div class="item">Row 2</div>
    </div>
  </body>
</html>
