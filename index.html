<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="card.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="main">
      <div class="card-container">
        <img
          src="https://img01.ztat.net/article/spp-media-p1/f699cffdf63f479bb708d4cbcc4cc4c1/dae2e8b670d64e95a48a4fc86064e4f6.jpg?imwidth=1800"
          alt="shoes"
        />
        <i class="fa-regular fa-heart heart-icon"></i>
        <div class="product-desc">
          <h2 class="product-title">Nike Running Shoe</h2>
          <div class="badges">
            <span class="badge">EU38</span>
            <span class="badge">BLACK/WHITE</span>
          </div>
          <p class="product-text">
            Crossing hardwood comfort with off-court flair. '80s-inspired
            construction, bold details and nothin'-but-net style.
          </p>
          <div class="price-section">
            <div>
              <p class="price-label">PRICE</p>
              <p class="price">$69.99</p>
            </div>
            <button class="add-to-cart">Add to cart</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
