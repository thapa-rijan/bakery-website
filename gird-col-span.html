<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grid Column Span Example</title>

    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      .container {
        display: grid;
        grid-template-columns: 100px 100px 100px;
        gap: 10px;
      }

      .item {
        background-color: #ff5722;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 5px;
      }

      .wide {
        grid-column: span 2;
        background-color: #3f51b5;
      }
    .wides {
        grid-row: span 2;
        background-color: #ff5722;
    }
    </style>
  </head>
  <body>
    <h2>Grid Column Span Example</h2>

    <div class="container">
      <div class="item wides">1</div>
      <div class="item wide">2 (span 2)</div>
      <div class="item">3</div>
      <div class="item">4</div>
    </div>
  </body>
</html>
