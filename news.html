<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .left,
    .middle,
    .right {
      float: left;
      width: 33.3333%;
      padding: 20px;
      text-align: center;
    }
    .left {
      background-color: #d9534f;
      color: #ffffff;
    }
    .middle {
      background-color: #f0ad4e;
      color: #000000;
    }
    .right {
      background-color: #0275d8;
      color: #ffffff;
    }

    @media only screen and (max-width: 640px) {
      .left,
      .middle,
      .right {
        width: 100%;
        float: none;
      }
    }
  </style>
  <body>
    <div style="overflow: auto">
      <div class="left">
        <h2>Left</h2>
        <p>Red box</p>
      </div>
      <div class="middle">
        <h2>Middle</h2>
        <p>Yellow box</p>
      </div>
      <div class="right">
        <h2>Right</h2>
        <p>Blue box</p>
      </div>
    </div>
  </body>
</html>
