<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Student License Form</h1>
    </header>
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Name" required>
        <label for="uname">University Name:</label><br>
        <label for="uadd">University Address:</label><br>
        <input type="text" id="uadd" name="uadd" placeholder="Street Address" required>
        <label for="stadd"></label>
        <input type="text" id="stadd" name="stadd" placeholder="Street Address Line 2">
        <label for="ct"></label>
        <input type="text" id="ct" name="ct" placeholder="City" required>
        <label for="rgn"></label>
        <input type="text" id="rgn" name="rgn" placeholder="Region" required>
        <label for="pcode"></label>
        <input type="Number" id="pcode" name="pcode" maxlength="5" placeholder="Postal/Zip Code">
        <University for="email">Student University Domain Email Address:</label><br>
        <input type="email" id="email" name="email" required>
    </form>
</body>
</html>
