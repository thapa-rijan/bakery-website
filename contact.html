<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    h1 {
      background-color: #333333;
      padding: 8px;
    }
    body {
      background-color: grey;
      color: antiquewhite;
    }
    table {
      width: 100%;
      height: 100%;
    }
    table {
      color: white;
      background-color: #333333;
      text-align: center;
    }
    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    td:hover,
    th:hover {
      background-color: antiquewhite;
    }
  </style>
  <body>
    <h1>Contacts</h1>
    <table>
      <tr>
        <th rowspan="2">State of Health</th>
        <th colspan="2">Fasting Value</th>
        <th>After Eating</th>
      </tr>
      <tr>
        <th>Minimum</th>
        <th>Maximum</th>
        <th>2 hours After Eating</th>
      </tr>
      <tr>
        <td>Healthy</td>
        <td>70</td>
        <td>100</td>
        <td>Less than 140</td>
      </tr>
      <tr>
        <td>Pre-Diabetes</td>
        <td>101</td>
        <td>126</td>
        <td>140 to 200</td>
      </tr>
      <tr>
        <td>Diabetes</td>
        <td>More than 126</td>
        <td>N/A</td>
        <td>More than 200</td>
      </tr>
    </table>
  </body>
</html>
